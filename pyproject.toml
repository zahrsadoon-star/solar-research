[project]
name = "solar-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "openpyxl", "tzdata", "scikit-learn", "pyarrow", "PyYAML", "optuna", "threadpoolctl"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
